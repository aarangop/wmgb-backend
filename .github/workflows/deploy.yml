name: Deploy

on:
  push:
    branches: [dev, main]
  # Allow manual triggering with environment override
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - production

env:
  MODELS_DIR: ${{ vars.MODELS_DIR || '/app/models' }}
  CAT_DOG_OTHER_CLASSIFIER:
    ${{ vars.CAT_DOG_OTHER_CLASSIFIER || 'cat-dog-other-classifier' }}
  API_VERSION: ${{ vars.API_VERSION || 'v1' }}

# Set permissions for OIDC authentication and package access
permissions:
  id-token: write # Required for requesting the JWT
  contents: read # Required for actions/checkout
  packages: write # Required for calling test.yml (which needs GHCR access)

jobs:
  # Determine environment based on branch
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.determine-env.outputs.environment }}
      is_production: ${{ steps.determine-env.outputs.is_production }}

    steps:
      - name: Determine deployment environment
        id: determine-env
        run: |
          # Determine environment based on trigger
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="production"
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            ENV="development"
          else
            ENV="development"  # Default fallback
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "🚀 Deploying to environment: $ENV"

          # Set production flag for conditional steps
          if [[ "$ENV" == "production" ]]; then
            echo "is_production=true" >> $GITHUB_OUTPUT
            echo "🏢 Production deployment detected"
          else
            echo "is_production=false" >> $GITHUB_OUTPUT
            echo "🛠️ Development deployment detected"
          fi

  # Run tests using the existing test workflow
  test:
    uses: ./.github/workflows/test.yml

  # Run integration tests (only for production)
  integration-tests:
    runs-on: ubuntu-latest
    needs: [setup, test]
    # Only run integration tests for production deployments
    if: needs.setup.outputs.is_production == 'true'
    environment: ${{ needs.setup.outputs.environment }}
    permissions:
      id-token: write
      contents: read
      packages: read

    steps:
      - name: Check disk space before
        run: df -h

      - name: Clean Docker resources
        run: docker system prune -af --volumes

      - name: Checkout code
        uses: actions/checkout@v4

      # Configure AWS credentials using OIDC (read-only for integration tests)
      - name: Configure AWS credentials for integration tests
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.READONLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-IntegrationTests

      # Log in to GitHub Container Registry to pull test image
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the test image from the test job
      - name: Pull test image
        run: |
          echo "🐳 Pulling test image: ${{ needs.test.outputs.image_tag }}"
          docker pull ${{ needs.test.outputs.image_tag }}

      # Create environment file for integration tests
      - name: Create integration test environment
        run: |
          echo "MODELS_DIR=${{ env.MODELS_DIR }}" > .env-docker
          echo "CAT_DOG_OTHER_CLASSIFIER=${{ env.CAT_DOG_OTHER_CLASSIFIER }}" >> .env-docker
          echo "MODEL_REPOSITORY_TYPE=caching" >> .env-docker
          echo "USE_LOCAL_MODEL_REPO=false" >> .env-docker
          echo "TESTING=false" >> .env-docker
          echo "S3_MODELS_BUCKET=${{ vars.MODELS_BUCKET }}" >> .env-docker
          echo "AWS_REGION=${{ vars.AWS_REGION }}" >> .env-docker
          echo "API_VERSION=${{ env.API_VERSION }}" >> .env-docker

      # Run integration tests against AWS resources
      - name: Run integration tests
        run: |
          echo "🧪 Running integration tests against production resources..."
          docker run --rm --env-file .env-docker ${{ needs.test.outputs.image_tag }} python -m pytest -m integration -v

  # Deploy to AWS
  deploy:
    runs-on: ubuntu-latest
    needs: [setup, test, integration-tests]
    # Run if tests pass and either integration tests pass (for prod) or are skipped (for dev)
    if: |
      always() && 
      needs.test.result == 'success' && 
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped')
    environment: ${{ needs.setup.outputs.environment }}
    # Permissions inherited from top level
    outputs:
      image_uri: ${{ steps.build-image.outputs.image }}
      deployment_environment: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Check disk space before
        run: df -h

      - name: Clean Docker resources
        run: docker system prune -af --volumes

      - name: Checkout code
        uses: actions/checkout@v4

      # Configure AWS credentials using OIDC for deployment
      - name: Configure AWS credentials for deployment
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-Deployment

      # Log in to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push image to ECR
      - name: Build and push to ECR
        id: build-image
        run: |
          # Set image details
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY=${{ vars.ECR_REPOSITORY }}

          # Environment-specific image tagging
          if [[ "${{ needs.setup.outputs.is_production }}" == "true" ]]; then
            IMAGE_TAG="prod-${{ github.sha }}"
            LATEST_TAG="latest"
          else
            IMAGE_TAG="dev-${{ github.sha }}"
            LATEST_TAG="latest-dev"
          fi

          echo "🔨 Building image for ${{ needs.setup.outputs.environment }} environment..."
          echo "📍 Registry: $ECR_REGISTRY"
          echo "📦 Repository: $ECR_REPOSITORY"
          echo "🏷️ Tags: $IMAGE_TAG, $LATEST_TAG"

          # Build the image
          docker build \
            --target production \
            --build-arg ENVIRONMENT=${{ needs.setup.outputs.environment }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG \
            .

          # Push both tags
          echo "📤 Pushing to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG

          # Output the image URI for ECS
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "✅ Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # Deploy to ECS
      - name: Deploy to ECS
        run: |
          echo "🚀 Deploying to ECS ${{ needs.setup.outputs.environment }} environment..."
          echo "🏗️ Cluster: ${{ vars.ECS_CLUSTER }}"
          echo "⚙️ Service: ${{ vars.ECS_SERVICE }}"
          echo "🖼️ Image: ${{ steps.build-image.outputs.image }}"

          # Force new deployment to pick up the new image
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --force-new-deployment \
            --no-cli-pager

      # Wait for deployment to complete
      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for ECS deployment to complete..."

          # Different timeouts for different environments
          if [[ "${{ needs.setup.outputs.is_production }}" == "true" ]]; then
            echo "Production deployment - allowing extra time..."
          else
            echo "Development deployment - faster turnaround expected..."
          fi

          # Wait for services to be stable
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --services ${{ vars.ECS_SERVICE }}

          echo "✅ Deployment completed successfully!"

      # Verify deployment
      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."

          # Get service information
          SERVICE_INFO=$(aws ecs describe-services \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --no-cli-pager)

          # Extract running task count
          RUNNING_COUNT=$(echo "$SERVICE_INFO" | jq -r '.services[0].runningCount')
          DESIRED_COUNT=$(echo "$SERVICE_INFO" | jq -r '.services[0].desiredCount')

          echo "📊 Service Status:"
          echo "  - Environment: ${{ needs.setup.outputs.environment }}"
          echo "  - Running tasks: $RUNNING_COUNT"
          echo "  - Desired tasks: $DESIRED_COUNT"
          echo "  - Cluster: ${{ vars.ECS_CLUSTER }}"
          echo "  - Service: ${{ vars.ECS_SERVICE }}"

          if [[ "$RUNNING_COUNT" -eq "$DESIRED_COUNT" && "$RUNNING_COUNT" -gt 0 ]]; then
            echo "✅ Deployment verification successful!"
          else
            echo "⚠️ Deployment verification: Service may still be starting up"
            echo "Check ECS console for detailed status"
          fi

      # Environment-specific post-deployment actions
      - name: Post-deployment actions
        run: |
          if [[ "${{ needs.setup.outputs.is_production }}" == "true" ]]; then
            echo "🏢 Production deployment completed"
            echo "Consider running additional production smoke tests here"
          else
            echo "🛠️ Development deployment completed"
            echo "Development environment ready for testing"
          fi

      - name: Deployment summary
        run: |
          echo "## 🎉 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **AWS Region**: ${{ vars.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ECS Cluster**: ${{ vars.ECS_CLUSTER }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ECS Service**: ${{ vars.ECS_SERVICE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Container Image**: \`${{ steps.build-image.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Git SHA**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY

          # Integration tests info
          if [[ "${{ needs.setup.outputs.is_production }}" == "true" ]]; then
            echo "- **Integration Tests**: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Integration Tests**: ⏭️ Skipped (development)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Deployment completed successfully!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Useful Links" >> $GITHUB_STEP_SUMMARY
          echo "- [ECS Console](https://${{ vars.AWS_REGION }}.console.aws.amazon.com/ecs/home?region=${{ vars.AWS_REGION }}#/clusters/${{ vars.ECS_CLUSTER }}/services)" >> $GITHUB_STEP_SUMMARY
          echo "- [ECR Repository](https://${{ vars.AWS_REGION }}.console.aws.amazon.com/ecr/repositories/private/${{ vars.ECR_REPOSITORY }})" >> $GITHUB_STEP_SUMMARY
          echo "- [CloudWatch Logs](https://${{ vars.AWS_REGION }}.console.aws.amazon.com/cloudwatch/home?region=${{ vars.AWS_REGION }}#logsV2:log-groups)" >> $GITHUB_STEP_SUMMARY
