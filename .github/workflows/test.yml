name: Automated Tests

on:
  workflow_call:
    # Define the outputs for the reusable workflow
    outputs:
      image_tag:
        description: "The docker image tag of the built test image"
        value: ${{ jobs.build-and-push.outputs.image_tag }}
      deps_tag:
        description: "The docker image tag of the dependencies image"
        value: ${{ jobs.build-and-push.outputs.deps_tag }}
  push:
    branches: [dev, main] # Run tests on both dev and main branches
  pull_request:
    branches: [dev, main] # Run tests on PRs to dev and main
  # Allow manual triggering for testing
  workflow_dispatch:

# Define environment variables at the top level
env:
  MODELS_DIR: ${{ vars.MODELS_DIR || '/app/models' }}
  CAT_DOG_OTHER_CLASSIFIER:
    ${{ vars.CAT_DOG_OTHER_CLASSIFIER || 'cat-dog-other-classifier' }}
  API_VERSION: ${{ vars.API_VERSION || 'v1' }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and push base image to GHCR for testing
  build-and-push:
    runs-on: ubuntu-latest
    # Set permissions needed for GHCR
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check disk space before
        run: |
          df -h
          du -sh /home/runner/* 2>/dev/null | sort -hr | head -10 || true

      - name: Clean Docker resources
        run: |
          docker system prune -af --volumes

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate unique but deterministic tags
      - name: Generate image tags
        id: tags
        run: |
          BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          BRANCH_NAME=${BRANCH_NAME//\//-}  # Replace / with -
          SHORT_SHA=${GITHUB_SHA:0:7}

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "deps_tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:deps-$BRANCH_NAME-$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "test_tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-$BRANCH_NAME-$SHORT_SHA" >> $GITHUB_OUTPUT

          echo "🏷️ Generated tags:"
          echo "  Branch: $BRANCH_NAME"
          echo "  SHA: $SHORT_SHA"
          echo "  Dependencies: deps-$BRANCH_NAME-$SHORT_SHA"
          echo "  Test: test-$BRANCH_NAME-$SHORT_SHA"

      # Build and push dev-dependencies stage to GHCR
      - name: Build and push dependencies image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: dev-dependencies
          tags: ${{ steps.tags.outputs.deps_tag }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      # Build and push unit-test stage to GHCR
      - name: Build and push unit-test image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: unit-test
          tags: ${{ steps.tags.outputs.test_tag }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            SKIP_POETRY_INSTALL_FOR_LIGHTER_TESTS=true

      - name: Check disk space after build
        run: |
          df -h
          docker images | head -10

    outputs:
      image_tag: ${{ steps.tags.outputs.test_tag }}
      deps_tag: ${{ steps.tags.outputs.deps_tag }}
      branch_name: ${{ steps.tags.outputs.branch_name }}
      short_sha: ${{ steps.tags.outputs.short_sha }}

  # Run unit tests using the pushed image
  unit-tests:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check disk space before
        run: df -h

      - name: Clean Docker resources
        run: docker system prune -af --volumes

      - name: Checkout code
        uses: actions/checkout@v4

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Create .env file for Docker to use
      - name: Create Docker environment file
        run: |
          # Create the Docker env file with only required vars for unit tests
          echo "MODELS_DIR=${{ env.MODELS_DIR }}" > .env-docker
          echo "TEST_MODELS_DIR=${{ env.MODELS_DIR }}/test" >> .env-docker
          echo "CAT_DOG_OTHER_CLASSIFIER=${{ env.CAT_DOG_OTHER_CLASSIFIER }}" >> .env-docker
          echo "USE_LOCAL_MODEL_REPO=true" >> .env-docker
          echo "TESTING=true" >> .env-docker

      - name: Run unit tests
        run: |
          # Pull the image from GHCR
          echo "🐳 Pulling test image: ${{ needs.build-and-push.outputs.image_tag }}"
          docker pull ${{ needs.build-and-push.outputs.image_tag }}

          # Print Python version and environment variables for debugging
          echo "🐍 Python environment check:"
          docker run --rm --env-file .env-docker ${{ needs.build-and-push.outputs.image_tag }} \
            python -c "import os, sys; print(f'Python {sys.version}'); print('Key ENV vars:', {k:v for k,v in dict(os.environ).items() if k in ['MODELS_DIR', 'TESTING', 'USE_LOCAL_MODEL_REPO']})"

          # Run the unit tests
          echo "🧪 Running unit tests..."
          docker run --rm --env-file .env-docker ${{ needs.build-and-push.outputs.image_tag }}

      - name: Check disk space after tests
        run: |
          df -h
          docker images | head -5

  # Optional: Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Log in to GHCR for dependencies image
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run code quality checks
        run: |
          echo "🔍 Running code quality checks..."
          # Pull the dependencies image which has all dev tools
          docker pull ${{ needs.build-and-push.outputs.deps_tag }}

          # Example quality checks (expand as needed):
          # echo "📋 Checking code formatting..."
          # docker run --rm -v $(pwd):/app -w /app ${{ needs.build-and-push.outputs.deps_tag }} black --check .

          # echo "🔧 Running linting..."
          # docker run --rm -v $(pwd):/app -w /app ${{ needs.build-and-push.outputs.deps_tag }} flake8 .

          # echo "🔒 Security scanning..."
          # docker run --rm -v $(pwd):/app -w /app ${{ needs.build-and-push.outputs.deps_tag }} bandit -r app/

          echo "✅ Code quality checks completed (placeholder - add actual checks as needed)"

  # Test summary
  test-summary:
    runs-on: ubuntu-latest
    needs: [build-and-push, unit-tests, code-quality]
    if: always() # Run even if some tests fail

    steps:
      - name: Test Results Summary
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ needs.build-and-push.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ needs.build-and-push.outputs.short_sha }} (${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Image**: \`${{ needs.build-and-push.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dependencies Image**: \`${{ needs.build-and-push.outputs.deps_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check job results
          if [[ "${{ needs.unit-tests.result }}" == "success" ]]; then
            echo "✅ **Unit Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Unit Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.code-quality.result }}" == "success" ]]; then
            echo "✅ **Code Quality**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Code Quality**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Overall status
          if [[ "${{ needs.unit-tests.result }}" == "success" && "${{ needs.code-quality.result }}" == "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 **All tests passed!** Ready for deployment." >> $GITHUB_STEP_SUMMARY
            
            # Branch-specific next steps
            if [[ "${{ needs.build-and-push.outputs.branch_name }}" == "dev" ]]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 🚀 Next: Development Deployment" >> $GITHUB_STEP_SUMMARY
              echo "This will trigger automatic deployment to the development environment." >> $GITHUB_STEP_SUMMARY
            elif [[ "${{ needs.build-and-push.outputs.branch_name }}" == "main" ]]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 🚀 Next: Production Deployment" >> $GITHUB_STEP_SUMMARY
              echo "This will trigger deployment to production (with approval required)." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Some tests failed.** Please review and fix before deployment." >> $GITHUB_STEP_SUMMARY
          fi
