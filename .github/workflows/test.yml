name: Test

on:
  workflow_call:
    # Define the outputs for the reusable workflow
    outputs:
      image_tag:
        description: "The docker image tag of the built test image"
        value: ${{ jobs.build-and-push.outputs.image_tag }}
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  # Allow manual triggering for testing
  workflow_dispatch:

# Set permissions for both standalone and called workflow runs
permissions:
  contents: read
  packages: write

# Define environment variables at the top level
env:
  MODELS_DIR: ${{ vars.MODELS_DIR || '/app/models' }}
  CAT_DOG_OTHER_CLASSIFIER:
    ${{ vars.CAT_DOG_OTHER_CLASSIFIER || 'cat-dog-other-classifier' }}
  API_VERSION: ${{ vars.API_VERSION || 'v1' }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and push test images to GHCR
  build-and-push:
    runs-on: ubuntu-latest
    # Permissions inherited from top level

    steps:
      - name: Check disk space before
        run: |
          df -h
          du -sh /home/runner/* 2>/dev/null | sort -hr | head -10 || true

      - name: Clean Docker resources
        run: |
          docker system prune -af --volumes

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate clean, deterministic tags
      - name: Generate image tags
        id: tags
        run: |
          BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          BRANCH_NAME=${BRANCH_NAME//\//-}  # Replace / with -
          SHORT_SHA=${GITHUB_SHA:0:7}

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "test_tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-$BRANCH_NAME-$SHORT_SHA" >> $GITHUB_OUTPUT

          echo "🏷️ Generated tags for testing:"
          echo "  Branch: $BRANCH_NAME"
          echo "  SHA: $SHORT_SHA"
          echo "  Test image: test-$BRANCH_NAME-$SHORT_SHA"

      # Build and push unit-test image to GHCR
      - name: Build and push test image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: unit-test
          tags: ${{ steps.tags.outputs.test_tag }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Check disk space after build
        run: |
          df -h
          docker images | head -5

    outputs:
      image_tag: ${{ steps.tags.outputs.test_tag }}
      branch_name: ${{ steps.tags.outputs.branch_name }}

  # Run unit tests
  unit-tests:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Permissions inherited from top level

    steps:
      - name: Clean Docker resources
        run: docker system prune -af --volumes

      - name: Checkout code
        uses: actions/checkout@v4

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Create environment file for unit tests
      - name: Create test environment
        run: |
          echo "MODELS_DIR=${{ env.MODELS_DIR }}" > .env-docker
          echo "TEST_MODELS_DIR=${{ env.MODELS_DIR }}/test" >> .env-docker
          echo "CAT_DOG_OTHER_CLASSIFIER=${{ env.CAT_DOG_OTHER_CLASSIFIER }}" >> .env-docker
          echo "USE_LOCAL_MODEL_REPO=true" >> .env-docker
          echo "TESTING=true" >> .env-docker

      - name: Run unit tests
        run: |
          echo "🐳 Pulling test image: ${{ needs.build-and-push.outputs.image_tag }}"
          docker pull ${{ needs.build-and-push.outputs.image_tag }}

          echo "🧪 Running unit tests..."
          docker run --rm --env-file .env-docker ${{ needs.build-and-push.outputs.image_tag }}

      - name: Unit test results
        run: |
          echo "✅ Unit tests completed successfully"

  # Code quality checks (placeholder for future expansion)
  code-quality:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Code quality placeholder
        run: |
          echo "🔍 Code quality checks would run here"
          echo "Examples: linting, formatting, security scans, etc."
          echo "✅ Code quality checks passed (placeholder)"

  # Test summary
  test-summary:
    runs-on: ubuntu-latest
    needs: [build-and-push, unit-tests, code-quality]
    if: always() # Run even if some tests fail

    steps:
      - name: Test Results Summary
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ needs.build-and-push.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Image**: \`${{ needs.build-and-push.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check individual job results
          if [[ "${{ needs.unit-tests.result }}" == "success" ]]; then
            echo "✅ **Unit Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Unit Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.code-quality.result }}" == "success" ]]; then
            echo "✅ **Code Quality**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Code Quality**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Overall status and next steps
          if [[ "${{ needs.unit-tests.result }}" == "success" && "${{ needs.code-quality.result }}" == "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 **All tests passed!**" >> $GITHUB_STEP_SUMMARY
            
            # Branch-specific guidance
            if [[ "${{ needs.build-and-push.outputs.branch_name }}" == "dev" ]]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 🚀 Ready for Development Deployment" >> $GITHUB_STEP_SUMMARY
              echo "This push will trigger automatic deployment to the development environment." >> $GITHUB_STEP_SUMMARY
            elif [[ "${{ needs.build-and-push.outputs.branch_name }}" == "main" ]]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 🚀 Ready for Production Deployment" >> $GITHUB_STEP_SUMMARY
              echo "This push will trigger deployment to production (approval required)." >> $GITHUB_STEP_SUMMARY
            else
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 📋 Pull Request Testing" >> $GITHUB_STEP_SUMMARY
              echo "Tests passed! Ready for code review and merge." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Some tests failed.** Please fix issues before deployment." >> $GITHUB_STEP_SUMMARY
          fi
